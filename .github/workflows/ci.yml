name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.30.0-pg18
        env:
          POSTGRES_USER: warcon
          POSTGRES_PASSWORD: warcon
          POSTGRES_DB: warcon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U warcon -d warcon"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://warcon:warcon@127.0.0.1:5432/warcon
      # bun test makes its own warcon_test_* database on this server for the permission suites
      TEST_DATABASE_URL: postgres://warcon:warcon@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun test
      - name: Guarded SQL contract on disposable PostgreSQL 18
        env:
          CI: 'true'
          WARCON_ISSUE95_TEST_DATABASE_URL: postgres://warcon:warcon@127.0.0.1:5432/warcon_issue95_test
        run: |
          bun -e '
            import { SQL } from "bun";
            import { connect, runMigrations, schema } from "./src/lib/server/db/index.ts";
            const admin = new SQL(process.env.TEST_DATABASE_URL, { max: 1 });
            try {
              await admin.unsafe("CREATE DATABASE warcon_issue95_test");
            } finally {
              await admin.close();
            }
            const { client, db } = connect(process.env.WARCON_ISSUE95_TEST_DATABASE_URL);
            try {
              await runMigrations(db, "./drizzle");
              await db.insert(schema.organizations).values({
                id: "org-test", name: "CI guarded contract", slug: "issue95-ci"
              });
              await db.insert(schema.lists).values({
                id: "list-reserve", orgId: "org-test", kind: "reserve", isDefault: true
              });
            } finally {
              await client.close();
            }
          '
          bun test src/lib/server/guarded-reserve.test.ts
      - run: bun run build
      - name: Smoke test the production build
        env:
          ORIGIN: http://127.0.0.1:5199
          PORT: 5199
          HOST: 127.0.0.1
          POLL_SECONDS: 5
        run: |
          BETTER_AUTH_SECRET=$(openssl rand -base64 32); export BETTER_AUTH_SECRET
          ENCRYPTION_KEY=$(openssl rand -base64 32); export ENCRYPTION_KEY
          bun ./build/index.js > server.log 2>&1 &
          up=0
          for _ in $(seq 1 60); do
            if curl -sf "$ORIGIN/api/health" >/dev/null; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then echo "::error::server did not become healthy within 60s"; exit 1; fi
          bash scripts/smoke.sh | tee smoke.out
          grep -q 'failed=0' smoke.out
      - name: Server log
        if: failure() && hashFiles('server.log') != ''
        run: cat server.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
